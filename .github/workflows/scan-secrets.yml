name: Scan committed files for credentials
on:
  workflow_call:
    inputs:
      runner:
        description: Runner labels as a JSON array
        type: string
        required: false
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ${{ fromJSON(inputs.runner || '["ubuntu-24.04"]') }}
    timeout-minutes: ${{ inputs.runner != '' && 60 || 5 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install verified Gitleaks
        run: |
          case "$(uname -m)" in
            x86_64) architecture=x64; checksum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
            aarch64|arm64) architecture=arm64; checksum=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080 ;;
            *) echo 'Unsupported scanner architecture' >&2; exit 1 ;;
          esac
          curl --fail --location --silent --show-error "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_${architecture}.tar.gz" --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "$checksum  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Reject committed credentials
        run: '"$RUNNER_TEMP/gitleaks" dir . --redact=100 --no-banner'
