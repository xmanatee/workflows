name: Qualify and publish private static application
on:
  workflow_call:
    inputs:
      publisher-ref:
        description: Exact shared publisher commit, also pinned by the local deploy command
        required: true
        type: string
      uv:
        description: Install the pinned uv prerequisite for Python build inputs
        type: boolean
        default: false
      submodules:
        description: Initialize the committed source submodules required by this build
        type: boolean
        default: false
    secrets:
      OPENAI_API_KEY:
        required: false
      ELEVENLABS_API_KEY:
        required: false
      HOL_UNLOCK_CODE:
        required: false
permissions:
  contents: read
  packages: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      published: ${{ steps.status.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: xmanatee/workflows
          ref: ${{ inputs.publisher-ref }}
          path: .publisher
          persist-credentials: false
      - id: status
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .publisher/release.py status
  verify:
    needs: plan
    if: needs.plan.outputs.published != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: ${{ inputs.submodules }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: xmanatee/workflows
          ref: ${{ inputs.publisher-ref }}
          path: .publisher
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: astral-sh/setup-uv@56618cab7a58e3efc9b282dd3de75bbf1075db9b
        if: inputs.uv
        with:
          version: '0.13.1'
          enable-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.npm
            ~/.local/share/pnpm/store
            ~/.cache/app-releases/tools
          key: release-tools-${{ runner.os }}-${{ hashFiles('.nvmrc', '**/package-lock.json', '**/pnpm-lock.yaml') }}
          restore-keys: release-tools-${{ runner.os }}-
      - name: Check and build committed source
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ github.event_name != 'pull_request' && secrets.OPENAI_API_KEY || '' }}
          ELEVENLABS_API_KEY: ${{ github.event_name != 'pull_request' && secrets.ELEVENLABS_API_KEY || '' }}
          HOL_UNLOCK_CODE: ${{ github.event_name != 'pull_request' && secrets.HOL_UNLOCK_CODE || '' }}
          VITE_ELEVENLABS_AGENT_ID: ${{ vars.VITE_ELEVENLABS_AGENT_ID }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_VISION_MODEL: ${{ vars.OPENAI_VISION_MODEL }}
        run: python3 .publisher/release.py verify --artifact "$RUNNER_TEMP/artifact"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: github.event_name != 'pull_request'
        with:
          name: qualified-app
          path: ${{ runner.temp }}/artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: [plan, verify]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.plan.outputs.published != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: xmanatee/workflows
          ref: ${{ inputs.publisher-ref }}
          path: .publisher
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: qualified-app
          path: ${{ runner.temp }}/artifact
      - name: Publish the verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .publisher/release.py publish --artifact "$RUNNER_TEMP/artifact"
