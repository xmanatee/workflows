name: Publish static application
on:
  workflow_call:
    inputs:
      artifact:
        type: string
        required: true
      dist:
        type: string
        required: true
      image:
        type: string
        required: true
permissions:
  contents: write
  packages: write
env:
  DOCKER_BUILD_SUMMARY: "false"
  DOCKER_BUILD_RECORD_UPLOAD: "false"
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: xmanatee/workflows
          path: publisher
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ inputs.artifact }}
          path: artifact
      - name: Prepare immutable runtime
        env:
          DIST: ${{ inputs.dist }}
        run: |
          test -f "artifact/$DIST/index.html"
          test -f artifact/nginx.conf
          mkdir image
          cp -a "artifact/$DIST" image/site
          cp artifact/nginx.conf image/nginx.conf
          cp publisher/docker/static.Dockerfile image/Dockerfile
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: image
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify the published application
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE"
          docker run --name acceptance --detach --publish 127.0.0.1:18080:80 "$IMAGE"
          trap 'docker rm -f acceptance' EXIT
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/ --output /tmp/response.html; then break; fi
            sleep 1
          done
          cmp image/site/index.html /tmp/response.html
          docker exec acceptance nginx -t
      - name: Scan the exact runtime image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          version: v0.76.0
          scanners: vuln
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg revision "$GITHUB_SHA" --arg image "$IMAGE" \
            '{repository:$repository,revision:$revision,images:{app:$image}}' > release.json
          gh release create "release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Release ${GITHUB_SHA:0:12}" --notes-file release.json --latest
